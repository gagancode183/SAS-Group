  <g>
     <path d="M470,620 C470,600 540,600 540,620 L530,668 C530,682 480,682 480,668 Z" fill="#A37B34"/>
     <ellipse cx="505" cy="616" rx="35" ry="9" fill="#C9A24E"/>
     <ellipse cx="505" cy="616" rx="24" ry="6" fill="#D8C28A"/>
