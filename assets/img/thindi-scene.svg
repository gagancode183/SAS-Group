<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EBD8"/>
      <stop offset="0.5" stop-color="#F8F4EC"/>
      <stop offset="1" stop-color="#EDE3CB"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.82" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#E9C07A" stop-opacity="0.8"/>
      <stop offset="0.35" stop-color="#E9C07A" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#E9C07A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0.8" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#F6E3B8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F6E3B8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4A3826"/>
      <stop offset="1" stop-color="#2E2315"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6B5136"/>
      <stop offset="1" stop-color="#5A422C"/>
    </linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8F6B2E"/>
      <stop offset="0.45" stop-color="#CDA050"/>
      <stop offset="1" stop-color="#7E5C25"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F2CB7F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#F2CB7F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="canopy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#66563B"/>
      <stop offset="0.5" stop-color="#89744B"/>
      <stop offset="1" stop-color="#66563B"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.55 0 0 0 0 0.5 0 0 0 0 0.42 0 0 0 0.06 0"/>
    </filter>
    <filter id="soft">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <rect width="1000" height="1250" fill="url(#sky)"/>
  <rect width="1000" height="1250" fill="url(#sun)"/>
  <polygon points="700,0 1000,0 250,1250 40,1250" fill="url(#beam)"/>

  <!-- faint temple + market silhouette -->
  <g fill="#CDBE9E" opacity="0.55">
    <path d="M120,470 L150,430 L180,470 L180,520 L120,520 Z"/>
    <path d="M176,470 L200,438 L224,470 L224,510 L176,510 Z"/>
    <path d="M108,520 h48 v18 h-48 z"/>
    <path d="M170,520 h48 v18 h-48 z"/>
    <path d="M760,480 L792,436 L824,480 L824,528 L760,528 Z"/>
    <path d="M820,480 L848,446 L876,480 L876,520 L820,520 Z"/>
    <path d="M752,528 h58 v16 h-58 z"/>
  </g>

  <!-- ground -->
  <rect x="0" y="990" width="1000" height="260" fill="#EBE0C6"/>

  <!-- cart wheels -->
  <g>
    <circle cx="320" cy="1060" r="128" fill="#3A2C1C" stroke="#241A0E" stroke-width="10"/>
    <circle cx="320" cy="1060" r="104" fill="none" stroke="#4A3826" stroke-width="5"/>
    <circle cx="320" cy="1060" r="18" fill="#5A4428"/>
    <g stroke="#241A0E" stroke-width="8" stroke-linecap="round">
      <path d="M320,956 V1164"/>
      <path d="M212,1060 H428"/>
      <path d="M244,984 L396,1136"/>
      <path d="M396,984 L244,1136"/>
    </g>
    <circle cx="680" cy="1060" r="128" fill="#3A2C1C" stroke="#241A0E" stroke-width="10"/>
    <circle cx="680" cy="1060" r="104" fill="none" stroke="#4A3826" stroke-width="5"/>
    <circle cx="680" cy="1060" r="18" fill="#5A4428"/>
    <g stroke="#241A0E" stroke-width="8" stroke-linecap="round">
      <path d="M680,956 V1164"/>
      <path d="M572,1060 H788"/>
      <path d="M604,984 L756,1136"/>
      <path d="M756,984 L604,1136"/>
    </g>
    <path d="M320,950 L320,720" stroke="#2E2315" stroke-width="26" stroke-linecap="round"/>
    <path d="M680,950 L680,720" stroke="#2E2315" stroke-width="26" stroke-linecap="round"/>
  </g>

  <!-- cart body -->
  <rect x="130" y="720" width="740" height="250" fill="url(#wood)"/>
  <g stroke="#241A0E" stroke-width="3" opacity="0.55">
    <path d="M130,780 H870"/><path d="M130,850 H870"/><path d="M130,920 H870"/>
  </g>
  <rect x="130" y="720" width="740" height="14" fill="#6B5136"/>
  <rect x="120" y="706" width="760" height="22" fill="url(#top)" rx="6"/>
  <rect x="350" y="752" width="300" height="74" fill="#A37B34" stroke="#241A0E" stroke-width="5"/>
  <g stroke="#8A6B45" stroke-width="2" opacity="0.6">
    <path d="M150,716 H850"/>
  </g>

  <!-- canopy posts -->
  <rect x="166" y="520" width="16" height="200" fill="#4A3826"/>
  <rect x="818" y="520" width="16" height="200" fill="#4A3826"/>

  <!-- canopy -->
  <path d="M130,486 L870,486 L828,560 L172,560 Z" fill="url(#canopy)"/>
  <path d="M130,486 L870,486 L848,510 L152,510 Z" fill="#A38A5B"/>
  <path d="M150,560 L172,560 L192,580 L168,580 Z" fill="#806A44"/>
  <path d="M168,580 L192,580 L212,600 L188,600 Z" fill="#806A44"/>
  <path d="M812,560 L850,560 L830,580 L808,580 Z" fill="#806A44"/>
  <path d="M808,580 L830,580 L812,600 L790,600 Z" fill="#806A44"/>
  <rect x="130" y="486" width="740" height="8" fill="#5A472D"/>

  <!-- hanging lamp -->
  <path d="M500,470 V532" stroke="#5A4428" stroke-width="3"/>
  <ellipse cx="500" cy="560" rx="70" ry="70" fill="url(#lampGlow)"/>
  <rect x="488" y="532" width="24" height="10" rx="3" fill="#8F6B2E"/>
  <path d="M470,542 L530,542 L520,580 L480,580 Z" fill="#A37B34"/>
  <path d="M480,580 L520,580 L508,590 L492,590 Z" fill="#C9A24E"/>

