    <path d="M0,0 Q10,18 34,12" stroke="#5C7A52" stroke-width="2" fill="none" opacity="0.7"/>
  </g>
  <g transform="translate(760,620)">
    <ellipse cx="0" cy="0" rx="130" ry="30" fill="#3A5A40" opacity="0.85"/>
    <path d="M-120,0 Q0,-22 120,0 Q0,22 -120,0 Z" fill="#2F4A36" opacity="0.55"/>
  </g>

  <!-- brass plates stack -->
  <g>
    <ellipse cx="700" cy="664" rx="64" ry="12" fill="#C9A24E"/>
    <rect x="638" y="600" width="124" height="64" fill="url(#brass)" rx="10"/>
    <ellipse cx="700" cy="600" rx="62" ry="13" fill="#D9B25E"/>
    <ellipse cx="700" cy="600" rx="40" ry="8" fill="#E8CD88" opacity="0.6"/>
    <g stroke="#7E5C25" stroke-width="2.5" opacity="0.7">
      <path d="M646,616 H754"/><path d="M646,632 H754"/><path d="M646,648 H754"/>
    </g>
  </g>

  <!-- filter coffee pot -->
  <g>
    <rect x="300" y="592" width="104" height="80" fill="url(#brass)" rx="8"/>
    <ellipse cx="352" cy="592" rx="52" ry="11" fill="#D9B25E"/>
    <path d="M300,592 Q300,552 352,552 Q404,552 404,592 Z" fill="#C9A24E"/>
    <ellipse cx="352" cy="552" rx="52" ry="10" fill="#D9B25E"/>
    <circle cx="352" cy="542" r="12" fill="#A37B34"/>
    <path d="M404,600 Q438,612 440,644 Q442,668 422,676" fill="none" stroke="#C9A24E" stroke-width="14" stroke-linecap="round"/>
