     <g fill="#80622D" opacity="0.7">
      <circle cx="492" cy="612" r="2.4"/><circle cx="516" cy="614" r="2"/><circle cx="502" cy="609" r="1.8"/>
    </g>
  </g>

  <!-- khara bowl -->
  <g>
    <path d="M600,620 C600,600 668,600 668,620 L658,668 C658,682 610,682 610,668 Z" fill="#8A5A2B"/>
    <ellipse cx="634" cy="616" rx="34" ry="9" fill="#B06A32"/>
    <ellipse cx="634" cy="616" rx="23" ry="6" fill="#C87E3E"/>
    <g fill="#8A4A1E" opacity="0.75">
      <circle cx="624" cy="612" r="2.2"/><circle cx="644" cy="613" r="2"/><circle cx="634" cy="609" r="1.8"/>
    </g>
    <path d="M622,652 C630,646 640,646 648,652" stroke="#5C3A1E" stroke-width="2" fill="none" opacity="0.6"/>
  </g>

  <!-- steam above bowls -->
  <g fill="none" stroke="#FFFDF4" stroke-width="7" stroke-linecap="round" opacity="0.75">
    <path d="M505,596 C490,576 522,566 506,546 C496,534 514,524 508,510"/>
    <path d="M634,596 C620,578 650,568 636,548 C628,536 644,526 638,512"/>
  </g>
  <g fill="none" stroke="#EFE3C6" stroke-width="5" stroke-linecap="round" opacity="0.5">
    <path d="M520,590 C530,574 500,562 512,544"/>
  </g>

  <!-- idli tray far right -->
  <g>
    <ellipse cx="852" cy="668" rx="66" ry="14" fill="#C9A24E"/>
    <rect x="788" y="600" width="128" height="68" fill="url(#brass)" rx="10"/>
    <ellipse cx="852" cy="600" rx="64" ry="13" fill="#D9B25E"/>
    <g fill="#F3F0E4">
      <ellipse cx="822" cy="598" rx="16" ry="9"/>
      <ellipse cx="852" cy="596" rx="16" ry="9"/>
      <ellipse cx="882" cy="598" rx="16" ry="9"/>
    </g>
  </g>

  <!-- hanging string of chillies -->
   <g stroke="#806A44" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M210,500 C190,540 200,580 180,620"/>
  </g>
   <g fill="#806A44">
    <path d="M205,510 C212,516 212,526 204,528 C198,528 197,518 205,510 Z"/>
    <path d="M199,535 C206,541 206,551 198,553 C192,553 191,543 199,535 Z"/>
    <path d="M204,560 C211,566 211,576 203,578 C197,578 196,568 204,560 Z"/>
    <path d="M190,585 C197,591 197,601 189,603 C183,603 182,593 190,585 Z"/>
  </g>

  <!-- foreground leaves -->
  <g transform="translate(60,1120) rotate(-12)">
    <ellipse cx="0" cy="0" rx="200" ry="44" fill="#3A5A40" opacity="0.5"/>
  </g>
  <g transform="translate(920,1150) rotate(14)">
    <ellipse cx="0" cy="0" rx="180" ry="38" fill="#3A5A40" opacity="0.45"/>
  </g>

  <!-- ground shadow -->
  <ellipse cx="500" cy="1205" rx="330" ry="22" fill="#3D3025" opacity="0.14"/>

  <!-- paper grain -->
  <rect width="1000" height="1250" filter="url(#grain)" opacity="0.5"/>
</svg>
