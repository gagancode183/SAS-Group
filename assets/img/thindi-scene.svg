    <path d="M352,540 C352,470 460,430 540,452" fill="none" stroke="#6B5136" stroke-width="26" stroke-linecap="round"/>
    <path d="M352,540 C352,470 460,430 540,452" fill="none" stroke="#8A6B45" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
    <circle cx="540" cy="452" r="16" fill="#6B5136"/>
  </g>

  <!-- small tumbler -->
  <rect x="236" y="636" width="44" height="52" fill="url(#brass)" rx="6"/>
  <ellipse cx="258" cy="636" rx="22" ry="7" fill="#D9B25E"/>
   <ellipse cx="258" cy="636" rx="14" ry="4.5" fill="#4B3924" opacity="0.85"/>

